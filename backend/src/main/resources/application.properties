# =========================
# APPLICATION NAME
# =========================
spring.application.name=backend

# =========================
# FILE UPLOAD CONFIG
# =========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================
# ERROR CONFIG
# =========================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# =========================
# DATABASE CONFIGURATION
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/emergency_alert_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA CONFIGURATION
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================
# SERVER CONFIG
# =========================
server.port=8080

# =========================
# JWT CONFIGURATION
# =========================
jwt.secret=EmergencyAlertSystemSecretKeyForJWTTokenGeneration2026SecureRandomKey
jwt.expiration=86400000

# =========================
# FILE UPLOAD PATH
# =========================
file.upload-dir=${user.dir}/uploads

# =========================
# EMAIL CONFIGURATION (Gmail SMTP)
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# =========================
# TWILIO SMS CONFIGURATION (Optional)
# =========================
twilio.account-sid=your-twilio-account-sid
twilio.auth-token=your-twilio-auth-token
twilio.phone-number=+1234567890

# =========================
# OPENWEATHERMAP API
# =========================
weather.api.key=your-openweathermap-api-key
weather.api.url=https://api.openweathermap.org/data/2.5

# =========================
# NEWSAPI
# =========================
news.api.key=your-newsapi-key
news.api.url=https://newsapi.org/v2

